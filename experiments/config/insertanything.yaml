flux_fill_path: "checkpoint/FLUX.1-Fill-dev"
flux_redux_path: "checkpoint/FLUX.1-Redux-dev"
dtype: "bfloat16"

model:
  union_cond_attn: true
  add_cond_attn: false
  latent_lora: false
  # Set to true to enable Scene-Aware Reference Harmonization (Version 2).
  # When false: exact baseline behaviour, zero runtime overhead.
  # When true:  adds cross-attention (ref Q → scene K/V) after dual blocks
  #             6, 12, and 18 with shared projections and per-stage gates
  #             alpha_0, alpha_1, alpha_2 (all zero-initialized).
  #             Harmonizer weights are saved to harmonizer.pt alongside
  #             pytorch_lora_weights.safetensors.
  use_scene_harmonizer: true

train:
  batch_size: 8
  accumulate_grad_batches: 1
  dataloader_workers: 5
  # pin_memory: false
  save_interval: 1000
  sample_interval: 500
  max_steps: 5000
  max_epochs: -1
  max_samples_per_category: 500
  gradient_checkpointing: true
  save_path: "runs"

  lora_config:
    r: 256
    lora_alpha: 256
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01
